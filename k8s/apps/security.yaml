# Cluster-wide security policy in k8s/security: the Cilium host firewall (only on nodes
# labelled cyberlab.io/host-firewall=enabled) and Kyverno's image signature checks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jakefrenzel/cyberlab-infra.git
    targetRevision: main
    path: k8s/security
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # On a fresh cluster Kyverno's CRDs (image-signatures.yaml) arrive with the
    # kyverno app; retry until they exist
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
