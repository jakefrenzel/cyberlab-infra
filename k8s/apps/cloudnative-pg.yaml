# CloudNativePG operator: runs PostgreSQL clusters declared as `Cluster` resources
# (the first one is cyberlab-mirror's database, in k8s/cyberlab-mirror). The operator
# itself only watches; each database runs in its app's own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    # Before the apps that declare Clusters (their CRD comes from here)
    argocd.argoproj.io/sync-wave: "-1"
    # Compare against the API server's view. The operator injects its own CA into the
    # chart's webhook configurations; a server-side diff only looks at the fields Argo
    # CD applies, so that isn't reported as drift (and self-heal doesn't undo it).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # 0.29.1 = operator 1.30.1 (2026-09-23)
    targetRevision: 0.29.1
    helm:
      valuesObject:
        image:
          # Pinned by digest: the chart only sets the tag. The operator also copies
          # this image into every database pod (its instance manager), so the digest
          # covers those too.
          tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        # The operator's own metrics (reconciles, errors), scraped by Prometheus. The
        # chart's dashboard option is a stub now; the dashboard ships from
        # k8s/monitoring/dashboards instead.
        monitoring:
          podMonitorEnabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CNPG's CRDs are too large for client-side apply's last-applied annotation
      - ServerSideApply=true
    # The operator passes "restricted" (non-root, read-only root filesystem, no
    # capabilities), so the namespace enforces it
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    # On a fresh cluster the PodMonitor CRD arrives with kube-prometheus-stack
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
