# Prometheus, Grafana, Alertmanager, node-exporter, and kube-state-metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.13.1
    helm:
      valuesObject:
        # Control-plane metrics listen on all interfaces via a Talos patch (metrics.tf).
        # Scheduler and controller-manager pods carry the kubeadm-style `component`
        # labels, so the chart defaults (HTTPS + bearer token) work as-is.
        # etcd is a Talos host service, not a pod: select the kube-apiserver pod instead.
        # It runs with hostNetwork on every control-plane node, so its endpoints are the
        # node IPs, and Prometheus scrapes etcd's :2381 there. No IPs in this repo.
        kubeEtcd:
          service:
            selector:
              component: kube-apiserver
          serviceMonitor:
            # Plain-HTTP metrics endpoint: don't send the Prometheus token in the clear
            authorization: null
        # No kube-proxy: Cilium replaces it
        kubeProxy:
          enabled: false

        grafana:
          # The chart's default admin password is the well-known "prom-operator", and a
          # chart-generated random one would change on every Argo CD render. Read it from
          # a Secret created once by hand instead (never committed).
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Keep Grafana's database (users, UI-made dashboards) across restarts
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          # Load dashboards shipped as ConfigMaps from any namespace (e.g. Cilium's)
          sidecar:
            dashboards:
              searchNamespace: ALL
          # Land on the lab's own overview (k8s/monitoring/dashboards) instead of an
          # empty Home page. The sidecar writes each ConfigMap key to this directory.
          grafana.ini:
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/cyberlab-overview.json

        alertmanager:
          # Replaces the chart's default config, which sends everything to "null".
          # The inhibit rules are the chart defaults, kept as-is.
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: discord
              group_by: [namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Always-firing heartbeat, sent to healthchecks.io every minute. If the
                # pings stop (pve1, the cluster, Prometheus, or Alertmanager is down),
                # healthchecks.io alerts from outside the lab: a dead-man's switch.
                # Alertmanager only considers a repeat at each group_interval tick, and a
                # repeat_interval equal to the tick lands just short of it, so 1m/1m
                # pinged every ~2 minutes. Ticking every 30s and repeating after 50s
                # gives a steady ping every minute.
                - receiver: healthchecks
                  matchers: [alertname = "Watchdog"]
                  group_wait: 0s
                  group_interval: 30s
                  repeat_interval: 50s
                - receiver: "null"
                  matchers: [alertname = "InfoInhibitor"]
                # Informational alerts are for dashboards, not notifications
                - receiver: "null"
                  matchers: [severity = "info"]
                # Falco events reach here from Falcosidekick at Warning and above
                # (minimumpriority in falco.yaml). Rules were tuned against the
                # 2026-10-25 -> 11-08 baseline first. Each event carries ~25 labels, so
                # they get their own message format, grouped per rule and pod.
                - receiver: discord-falco
                  matchers: [source = "falco"]
                  group_by: [rule, hostname, k8s_ns_name, k8s_pod_name]
            receivers:
              - name: "null"
              - name: healthchecks
                webhook_configs:
                  # The ping URL is a credential (anyone with it can report "all fine"):
                  # mounted from the hand-made alertmanager-healthchecks Secret
                  - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
                    send_resolved: false
              - name: discord
                discord_configs:
                  # Mounted from the hand-made alertmanager-discord Secret (below)
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    send_resolved: true
              - name: discord-falco
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    # A Falco event is a moment, not a state: skip the "resolved" message
                    # that would follow 5 minutes later
                    send_resolved: false
                    title: >-
                      Falco {{ .CommonLabels.priority }}: {{ .CommonLabels.rule }}{{ if gt (len .Alerts) 1 }} (x{{ len .Alerts }}){{ end }}
                    # <t:unix:f> renders in the reader's own timezone
                    message: |-
                      {{ range .Alerts -}}
                      **Node:** {{ .Labels.hostname }}{{ if .Labels.k8s_pod_name }} · **Pod:** {{ .Labels.k8s_ns_name }}/{{ .Labels.k8s_pod_name }}{{ end }}
                      {{ if .Labels.container_image_repository }}**Image:** {{ .Labels.container_image_repository }}:{{ .Labels.container_image_tag }}
                      {{ end }}**Process:** `{{ .Labels.proc_cmdline }}` (parent {{ .Labels.proc_pname }}, user {{ .Labels.user_name }})
                      {{ if .Labels.fd_name }}**Target:** `{{ .Labels.fd_name }}`
                      {{ end }}**When:** <t:{{ .StartsAt.Unix }}:f>

                      {{ end }}
            inhibit_rules:
              - source_matchers: [severity = critical]
                target_matchers: [severity =~ warning|info]
                equal: [namespace, alertname]
              - source_matchers: [severity = warning]
                target_matchers: [severity = info]
                equal: [namespace, alertname]
              - source_matchers: [alertname = InfoInhibitor]
                target_matchers: [severity = info]
                equal: [namespace]
              - target_matchers: [alertname = InfoInhibitor]
            templates:
              - /etc/alertmanager/config/*.tmpl
          alertmanagerSpec:
            # The Discord webhook and healthchecks.io ping URLs are credentials: created
            # by hand, never committed (see k8s/monitoring/README.md). Mounted under
            # /etc/alertmanager/secrets/. The pod can't start until both exist.
            secrets: [alertmanager-discord, alertmanager-healthchecks]
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi

        prometheus:
          prometheusSpec:
            # 15 days of history, capped below the 10Gi volume so it can never fill up
            retention: 15d
            retentionSize: 8GiB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
            # Pick up ServiceMonitors/PodMonitors/rules from every namespace, not only
            # ones labelled for this Helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The chart's CRDs are too large for client-side apply's last-applied annotation
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
