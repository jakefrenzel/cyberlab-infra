# Prometheus, Grafana, Alertmanager, node-exporter, and kube-state-metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.13.1
    helm:
      valuesObject:
        # Control-plane metrics listen on all interfaces via a Talos patch (metrics.tf).
        # Scheduler and controller-manager pods carry the kubeadm-style `component`
        # labels, so the chart defaults (HTTPS + bearer token) work as-is.
        # etcd is a Talos host service, not a pod: select the kube-apiserver pod instead.
        # It runs with hostNetwork on every control-plane node, so its endpoints are the
        # node IPs, and Prometheus scrapes etcd's :2381 there. No IPs in this repo.
        kubeEtcd:
          service:
            selector:
              component: kube-apiserver
          serviceMonitor:
            # Plain-HTTP metrics endpoint: don't send the Prometheus token in the clear
            authorization: null
        # No kube-proxy: Cilium replaces it
        kubeProxy:
          enabled: false

        grafana:
          # The chart's default admin password is the well-known "prom-operator", and a
          # chart-generated random one would change on every Argo CD render. Read it from
          # a Secret created once by hand instead (never committed).
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Keep Grafana's database (users, UI-made dashboards) across restarts
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          # Load dashboards shipped as ConfigMaps from any namespace (e.g. Cilium's)
          sidecar:
            dashboards:
              searchNamespace: ALL
          # Land on the lab's own overview (k8s/monitoring/dashboards) instead of an
          # empty Home page. The sidecar writes each ConfigMap key to this directory.
          grafana.ini:
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/cyberlab-overview.json

        alertmanager:
          # Replaces the chart's default config, which sends everything to "null".
          # The inhibit rules are the chart defaults, kept as-is.
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: discord
              group_by: [namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Always-firing heartbeat that proves the alert pipeline works
                - receiver: "null"
                  matchers: [alertname = "Watchdog"]
                - receiver: "null"
                  matchers: [alertname = "InfoInhibitor"]
                # Informational alerts are for dashboards, not notifications
                - receiver: "null"
                  matchers: [severity = "info"]
                # Falco events (forwarded by Falcosidekick) stay in Alertmanager and the
                # Falcosidekick UI until the rules are tuned against a baseline
                - receiver: "null"
                  matchers: [source = "falco"]
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  # Mounted from the hand-made alertmanager-discord Secret (below)
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    send_resolved: true
            inhibit_rules:
              - source_matchers: [severity = critical]
                target_matchers: [severity =~ warning|info]
                equal: [namespace, alertname]
              - source_matchers: [severity = warning]
                target_matchers: [severity = info]
                equal: [namespace, alertname]
              - source_matchers: [alertname = InfoInhibitor]
                target_matchers: [severity = info]
                equal: [namespace]
              - target_matchers: [alertname = InfoInhibitor]
            templates:
              - /etc/alertmanager/config/*.tmpl
          alertmanagerSpec:
            # The Discord webhook URL is a credential: created by hand, never committed
            # (see k8s/monitoring/README.md). Mounted under /etc/alertmanager/secrets/.
            secrets: [alertmanager-discord]
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi

        prometheus:
          prometheusSpec:
            # 15 days of history, capped below the 10Gi volume so it can never fill up
            retention: 15d
            retentionSize: 8GiB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
            # Pick up ServiceMonitors/PodMonitors/rules from every namespace, not only
            # ones labelled for this Helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The chart's CRDs are too large for client-side apply's last-applied annotation
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
