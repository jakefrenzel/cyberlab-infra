# The GitHub mirror, synced by the cyberlab-mirror Application: its database, the Go
# API, and the web front end.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cyberlab-mirror
resources:
  - database.yaml
  - database-networkpolicy.yaml
  - database-monitoring.yaml
  - api.yaml
  - web.yaml
  - app-networkpolicy.yaml
  - app-monitoring.yaml
# Deploying a release = changing these lines. The digest is what actually runs, so a
# re-pushed tag can't change it; the tag is for humans. The release workflow in
# github.com/jakefrenzel/cyberlab-mirror opens a PR that changes them (each image's
# own entry only); merging it deploys.
images:
  - name: ghcr.io/jakefrenzel/cyberlab-mirror-api
    newTag: "0.4.0"
    digest: sha256:108d7b7f4e52a14b6ff22cb80029e2c95e73b0bac0a201692ccd681b363ebe67
  - name: ghcr.io/jakefrenzel/cyberlab-mirror-web
    newTag: "0.4.0"
    digest: sha256:ea3a5112a9e4b2fc3fa3ce343ac0ee2bb36a3e01d5b7568c0b69907aa240a6bd
