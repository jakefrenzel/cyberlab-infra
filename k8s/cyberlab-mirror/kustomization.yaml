# The GitHub mirror, synced by the cyberlab-mirror Application. So far only its
# database; the API and web front end come next.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cyberlab-mirror
resources:
  - database.yaml
  - database-networkpolicy.yaml
  - database-monitoring.yaml
# Deploying a release = changing these lines. The digest is what actually runs, so a
# re-pushed tag can't change it; the tag is for humans. The release workflow in
# github.com/jakefrenzel/cyberlab-mirror opens a PR that changes them (each image's
# own entry only); merging it deploys. Until the API's Deployment is added here, no
# resource uses the image, so the entry changes nothing.
images:
  - name: ghcr.io/jakefrenzel/cyberlab-mirror-api
    newTag: "0.1.0"
    digest: sha256:ae712953b6dfd38660aae8955b1c79b4196b18ccf5798ceb38c3985b3ee00070
