# Host firewall (Cilium host policies, enabled in cilium.tf). Applies only to nodes
# labelled cyberlab.io/host-firewall=enabled, so it can be rolled out one node at a time.
# Once a node is selected, ingress to it that no rule below allows is dropped; the
# node's own outgoing traffic is unaffected.
#
# Admin access from the laptop arrives through the Tailscale subnet router on the
# Proxmox host, SNATed to its bridge address, so it is `world` here. Only the
# Kubernetes and Talos APIs are open to it.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-nodes
spec:
  description: Baseline ingress for every firewalled node
  nodeSelector:
    matchLabels:
      cyberlab.io/host-firewall: enabled
  ingress:
    # Node-to-node traffic: VXLAN, kubelet, Talos API proxying, Cilium health/Hubble peer
    - fromEntities: [host, remote-node, kube-apiserver, health]

    # Admin access: Kubernetes API and Talos API only
    - fromEntities: [world]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
            - { port: "50000", protocol: TCP }

    # Pods: the API server (via the kubernetes Service) and Talos' host DNS, which
    # CoreDNS forwards to
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP }
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }

    # Metrics on every node: kubelet, node-exporter, Cilium agent/operator/Envoy, Hubble
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "9100", protocol: TCP }
            - { port: "9962", protocol: TCP }
            - { port: "9963", protocol: TCP }
            - { port: "9964", protocol: TCP }
            - { port: "9965", protocol: TCP }

    # Hubble Relay collects flows from every node's Hubble server
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: hubble-relay
      toPorts:
        - ports:
            - { port: "4244", protocol: TCP }

    - fromEntities: [world, cluster]
      icmps:
        - fields:
            - { type: EchoRequest, family: IPv4 }
---
# Control-plane metrics exposed by metrics.tf: only Prometheus may scrape them.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-control-plane
spec:
  description: Control-plane metrics, Prometheus only
  nodeSelector:
    matchLabels:
      cyberlab.io/host-firewall: enabled
      node-role.kubernetes.io/control-plane: ""
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - { port: "2381", protocol: TCP }
            - { port: "10257", protocol: TCP }
            - { port: "10259", protocol: TCP }
