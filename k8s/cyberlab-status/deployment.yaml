# The status page (github.com/jakefrenzel/cyberlab-status). The image and its digest
# are set in kustomization.yaml. Everything here passes Pod Security "restricted",
# which the namespace enforces (k8s/apps/cyberlab-status.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberlab-status
# It never talks to the Kubernetes API, so it gets no API token at all
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberlab-status
  labels:
    app.kubernetes.io/name: cyberlab-status
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cyberlab-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyberlab-status
    spec:
      serviceAccountName: cyberlab-status
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jakefrenzel/cyberlab-status
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: cyberlab-status
  labels:
    app.kubernetes.io/name: cyberlab-status
spec:
  selector:
    app.kubernetes.io/name: cyberlab-status
  ports:
    - name: http
      port: 80
      targetPort: http
