# Default deny for the whole namespace, then exactly what the app needs: DNS and
# Prometheus's API out, Prometheus's scrape in. kubectl port-forward still works,
# because it connects from inside the pod's own network namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cyberlab-status
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scraping /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Resolving kube-prometheus-stack-prometheus.monitoring.svc
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Querying Prometheus's API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
