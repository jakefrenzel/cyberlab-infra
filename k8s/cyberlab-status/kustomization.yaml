# The status page, synced by the cyberlab-status Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cyberlab-status
resources:
  - deployment.yaml
  - networkpolicy.yaml
  - monitoring.yaml
# Deploying a release = changing these two lines. The digest is what actually runs,
# so a re-pushed tag can't change it; the tag is for humans. The release workflow in
# github.com/jakefrenzel/cyberlab-status opens a PR that changes them; merging it deploys.
images:
  - name: ghcr.io/jakefrenzel/cyberlab-status
    newTag: "0.2.0"
    digest: sha256:dd33e6b1491012889af2e42d93a2b085f4173ab3c7c4489935b7092f1ea3e922
