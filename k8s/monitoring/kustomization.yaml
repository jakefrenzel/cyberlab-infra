# Everything the monitoring-config Application syncs into the monitoring namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cilium-monitors.yaml
  - argocd-monitor.yaml
  - cyberlab-alerts.yaml
# Dashboards live as plain JSON in dashboards/ (importable into any Grafana) and ship
# as ConfigMaps. Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: cyberlab-overview-dashboard
    namespace: monitoring
    files:
      - dashboards/cyberlab-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      # A fixed name, so Grafana's home-dashboard path in kube-prometheus-stack.yaml
      # and the sidecar's file stay stable across edits
      disableNameSuffixHash: true
  # CloudNativePG's dashboard, from github.com/cloudnative-pg/grafana-dashboards tag
  # cluster-v0.0.5 (commit cececeb, charts/cluster/grafana-dashboard.json). One edit:
  # the expression panel's datasource "${DS_EXPRESSION}" -> "__expr__", because that
  # placeholder is only filled in by Grafana's manual import, not by the sidecar.
  - name: cloudnative-pg-dashboard
    namespace: monitoring
    files:
      - dashboards/cloudnative-pg.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # 246 KB: client-side apply would copy it into a last-applied annotation,
        # close to the 256 KB annotation limit
        argocd.argoproj.io/sync-options: ServerSideApply=true
      disableNameSuffixHash: true
