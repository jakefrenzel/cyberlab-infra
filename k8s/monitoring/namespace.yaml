# node-exporter needs hostNetwork, hostPID, and hostPath mounts to read node hardware
# stats, which the cluster-wide "baseline" Pod Security level rejects. The exception is
# scoped to this namespace only.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
